<defs><marker id="ah-plan-overview-is" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs>
<rect y="96" width="1280" height="784" class="bg"/>
<g class="k-src"><rect x="30" y="220" width="180" height="122" rx="6" class="bx"/>
<circle cx="48" cy="220" r="10" class="num"/>
<text x="48" y="224" class="numt" text-anchor="middle">1</text>
<text x="42" y="250" class="t">Kennslubók OpenStax</text>
<text x="42" y="269" class="s">enskur frumtexti,</text>
<text x="42" y="284" class="s">dreginn út á ný</text>
</g>
<g class="k-mt"><rect x="238" y="220" width="180" height="122" rx="6" class="bx"/>
<circle cx="256" cy="220" r="10" class="num"/>
<text x="256" y="224" class="numt" text-anchor="middle">2</text>
<text x="250" y="250" class="t">Vélþýðing</text>
<text x="250" y="269" class="s">geymd nákvæmlega</text>
<text x="250" y="284" class="s">eins og hún barst</text>
</g>
<g class="k-mt"><rect x="250" y="316" width="41" height="17" rx="8.5" class="tag"/></g>
<text x="257" y="328" class="tagt" text-anchor="start">LAG 1</text>
<g class="k-ai"><rect x="446" y="220" width="180" height="122" rx="6" class="bx"/>
<circle cx="464" cy="220" r="10" class="num"/>
<text x="464" y="224" class="numt" text-anchor="middle">3</text>
<text x="458" y="250" class="t">Tillögur</text>
<text x="458" y="269" class="s">íðorðareglur verksins</text>
<text x="458" y="284" class="s">og þröng yfirferð</text>
<text x="458" y="299" class="s">gervigreindar á íðorðum</text>
</g>
<g class="k-ai"><rect x="458" y="316" width="41" height="17" rx="8.5" class="tag"/></g>
<text x="465" y="328" class="tagt" text-anchor="start">LAG 2</text>
<g class="k-hum"><rect x="654" y="220" width="180" height="122" rx="6" class="bx"/>
<circle cx="672" cy="220" r="10" class="num"/>
<text x="672" y="224" class="numt" text-anchor="middle">4</text>
<text x="666" y="250" class="t">Ritstjórar yfirfara</text>
<text x="666" y="269" class="s">samþykkja eða hafna</text>
<text x="666" y="284" class="s">hverri tillögu, laga</text>
<text x="666" y="299" class="s">annað í höndunum</text>
</g>
<g class="k-hum"><rect x="862" y="220" width="180" height="122" rx="6" class="bx"/>
<circle cx="880" cy="220" r="10" class="num"/>
<text x="880" y="224" class="numt" text-anchor="middle">5</text>
<text x="874" y="250" class="t">Samþykktur texti</text>
<text x="874" y="269" class="s">aðeins það sem ritstjóri</text>
<text x="874" y="284" class="s">breytti eða samþykkti</text>
<text x="874" y="299" class="s">telst mannlegt</text>
</g>
<g class="k-hum"><rect x="874" y="316" width="41" height="17" rx="8.5" class="tag"/></g>
<text x="881" y="328" class="tagt" text-anchor="start">LAG 3</text>
<g class="k-out"><rect x="1070" y="220" width="180" height="122" rx="6" class="bx"/>
<circle cx="1088" cy="220" r="10" class="num"/>
<text x="1088" y="224" class="numt" text-anchor="middle">6</text>
<text x="1082" y="250" class="t">Yfirfarin bók</text>
<text x="1082" y="269" class="s">á vefnum kafla</text>
<text x="1082" y="284" class="s">fyrir kafla, borði</text>
<text x="1082" y="299" class="s">vélþýðingar fjarlægður</text>
</g>
