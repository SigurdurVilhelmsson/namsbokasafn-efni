<text x="848" y="180" class="gatet" text-anchor="middle">VISTUNARHLIÐ</text>
<polyline points="328.0,220 328.0,140 1160.0,140 1160.0,218" class="ar " marker-end="url(#ah-plan-overview-is)"/>
<text x="744.0" y="128" class="lbl" text-anchor="middle">Vélþýðingin er áfram á vefnum þar til yfirfarinn kafli er birtur.</text>
<g class="k-term"><rect x="446" y="450" width="180" height="104" rx="6" class="bx"/>
<text x="458" y="472" class="t">Íðorðatól</text>
<text x="458" y="491" class="s">finna íðorð eftir</text>
<text x="458" y="506" class="s">nefnimynd og orðflokki;</text>
<text x="458" y="521" class="s">koma ákvörðun í allar</text>
<text x="458" y="536" class="s">beygingarmyndir</text>
</g>
<polyline points="536.0,450 536.0,410 694,410 694,344" class="ar " marker-end="url(#ah-plan-overview-is)"/>
<text x="544.0" y="402" class="lbl" text-anchor="start">B2 · B3</text>
<g class="k-meas"><rect x="654" y="450" width="180" height="104" rx="6" class="bx"/>
<text x="666" y="472" class="t">Mælingar</text>
<text x="666" y="491" class="s">virkur vinnutími og</text>
<text x="666" y="506" class="s">breytingafjarlægð;</text>
<text x="666" y="521" class="s">aðeins birt samanlagt</text>
</g>
<polyline points="774.0,342 774.0,448" class="ar dash " marker-end="url(#ah-plan-overview-is)"/>
<text x="782.0" y="430" class="lbl" text-anchor="start">B1 skráir</text>
<g class="k-out"><rect x="862" y="450" width="180" height="104" rx="6" class="bx"/>
<text x="874" y="472" class="t">Opnar útgáfur</text>
<text x="874" y="491" class="s">TMX, samhliða málheild,</text>
<text x="874" y="506" class="s">íðorðasafn</text>
<text x="874" y="521" class="s">efnafræði · CC BY 4.0</text>
</g>
<polyline points="952.0,342 952.0,448" class="ar " marker-end="url(#ah-plan-overview-is)"/>
<rect x="930.0" y="388" width="44" height="8" class="gate"/>
<text x="980.0" y="396" class="gatet" text-anchor="start">ÚTGÁFUHLIÐ</text>
<g class="k-out"><rect x="1070" y="450" width="180" height="104" rx="6" class="bx"/>
<text x="1082" y="472" class="t">Hljóð</text>
<text x="1082" y="491" class="s">talgerving</text>
<text x="1082" y="506" class="s">yfirfarinna kafla,</text>
<text x="1082" y="521" class="s">á eigin vélbúnaði</text>
</g>
<polyline points="1160.0,342 1160.0,448" class="ar " marker-end="url(#ah-plan-overview-is)"/>
<text x="1168.0" y="430" class="lbl" text-anchor="start">C</text>
<g class="k-note"><rect x="30" y="450" width="388" height="104" rx="6" class="bx"/>
<text x="42" y="472" class="t">Rannsóknarsamanburður</text>
<text x="42" y="491" class="s">Lög 1, 2 og 3 eru geymd aðskilin svo að grein</text>
<text x="42" y="506" class="s">geti borið saman hreina vélþýðingu, vélþýðingu</text>
<text x="42" y="521" class="s">með gervigreindarbreytingum og ritstýrðan texta.</text>
</g>
