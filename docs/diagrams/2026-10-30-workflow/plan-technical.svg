<text x="98" y="560" class="lbl" text-anchor="start">select / re-request</text>
<polyline points="90,700 90,748" class="ar " marker-end="url(#ah-plan-technical-en)"/>
<text x="98" y="730" class="lbl" text-anchor="start">inject + render</text>
<g class="k-term"><rect x="290" y="70" width="200" height="120" rx="6" class="bx"/>
<text x="302" y="92" class="t">Ruling set</text>
<text x="302" y="111" class="s">project lead’s term rulings</text>
<text x="302" y="126" class="s">compiled into one dated</text>
<text x="302" y="141" class="s">artifact with scopes</text>
</g>
<g class="k-ai"><rect x="290" y="240" width="200" height="120" rx="6" class="bx"/>
<text x="302" y="262" class="t">Rule layer</text>
<text x="302" y="281" class="s">deterministic edits: key-</text>
<text x="302" y="296" class="s">term headwords, markup,</text>
<text x="302" y="311" class="s">computed exact swaps</text>
</g>
<g class="k-ai"><rect x="290" y="410" width="200" height="120" rx="6" class="bx"/>
<text x="302" y="432" class="t">AI term pass</text>
<text x="302" y="451" class="m">ai-review/ · edit ops</text>
<text x="302" y="466" class="s">find, replace, ruling id;</text>
<text x="302" y="481" class="s">code gate checks scope</text>
</g>
<g class="k-ai"><rect x="290" y="580" width="200" height="120" rx="6" class="bx"/>
<text x="302" y="602" class="t">Layer 2 · 02-mt-revised/</text>
<text x="302" y="621" class="s">per-change log; hashes of</text>
<text x="302" y="636" class="s">inputs, prompt and model</text>
<text x="302" y="651" class="s">refuse on any change</text>
</g>
<g class="k-src"><rect x="290" y="750" width="200" height="120" rx="6" class="bx"/>
<text x="302" y="772" class="t">Freeze</text>
<text x="302" y="791" class="s">git tag + manifest of</text>
<text x="302" y="806" class="s">every layer, before the</text>
<text x="302" y="821" class="s">first unit opens</text>
</g>
