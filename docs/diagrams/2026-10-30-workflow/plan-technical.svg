<defs><marker id="ah-plan-technical-en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs>
<rect y="0" width="1430" height="1110" class="bg"/>
<text x="140.0" y="36" class="hdr" text-anchor="middle">SOURCE AND MT</text>
<text x="390.0" y="36" class="hdr" text-anchor="middle">MACHINE LAYERS · PREP</text>
<text x="685.0" y="36" class="hdr" text-anchor="middle">EDITING IN RITSTJÓRI</text>
<text x="1005.0" y="36" class="hdr" text-anchor="middle">APPLY AND PUBLISH</text>
<text x="1290.0" y="36" class="hdr" text-anchor="middle">OPEN RELEASES (D)</text>
<rect x="536.0" y="50" width="18" height="1000" class="gate"/>
<text x="549" y="340" class="gater" text-anchor="middle" transform="rotate(-90 549 340)">EDITING GATE · measurement live · consent · write and scope guards · editor privacy · BÍN credit</text>
<rect x="856.0" y="50" width="18" height="1000" class="gate"/>
<text x="869" y="690" class="gater" text-anchor="middle" transform="rotate(-90 869 690)">APPLY GATE · base-text guard · per-segment “human” in TM + corpus · sidecar privacy · completion rule · hold lifted</text>
<rect x="1136.0" y="50" width="18" height="1000" class="gate"/>
<text x="1149" y="790" class="gater" text-anchor="middle" transform="rotate(-90 1149 790)">RELEASE GATE · rights on file · BÍN contained · licence and credit fields</text>
<g class="k-src"><rect x="30" y="70" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="92" class="t">01-source/</text>
<text x="42" y="111" class="s">OpenStax CNXML, read-only</text>
<text x="42" y="126" class="s">never refreshed from</text>
<text x="42" y="141" class="s">upstream without consent</text>
</g>
<g class="k-src"><rect x="30" y="240" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="262" class="t">02-for-mt/ · 02-structure/</text>
<text x="42" y="281" class="s">re-extracted EN segments</text>
<text x="42" y="296" class="s">one marker dialect</text>
</g>
<g class="k-mt"><rect x="30" y="410" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="432" class="t">Layer 1 · 02-mt-output/</text>
<text x="42" y="451" class="s">pure Málstaður output</text>
<text x="42" y="466" class="s">never overwritten</text>
<text x="42" y="481" class="s">provenance per module</text>
</g>
<g class="k-mt"><rect x="30" y="580" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="602" class="t">Layer 1s · 02-mt-selected/</text>
<text x="42" y="621" class="s">per-segment choice of API</text>
<text x="42" y="636" class="s">runs + manifest; re-request</text>
<text x="42" y="651" class="s">mode for untranslated ones</text>
</g>
<g class="k-out"><rect x="30" y="750" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="772" class="t">MT preview</text>
<text x="42" y="791" class="s">layer 1s injected and</text>
<text x="42" y="806" class="s">rendered; readers see it</text>
<text x="42" y="821" class="s">until a chapter is reviewed</text>
</g>
<g class="k-note"><rect x="30" y="920" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="942" class="t">Free checks</text>
<text x="42" y="961" class="s">round-trip + render oracle</text>
<text x="42" y="976" class="s">marker census, sentinel</text>
<text x="42" y="991" class="s">before any preview ships</text>
</g>
<polyline points="90,190 90,238" class="ar " marker-end="url(#ah-plan-technical-en)"/>
