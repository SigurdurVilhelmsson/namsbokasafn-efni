<polyline points="390,700 390,748" class="ar " marker-end="url(#ah-plan-technical-en)"/>
<text x="398" y="730" class="lbl" text-anchor="start">recorded in</text>
<g class="k-hum"><rect x="570" y="70" width="230" height="120" rx="6" class="bx"/>
<text x="582" y="92" class="t">Editors sign in</text>
<text x="582" y="111" class="s">written consent recorded</text>
<text x="582" y="126" class="s">chapters assigned</text>
<text x="582" y="141" class="s">organic + withheld books refused</text>
</g>
<g class="k-hum"><rect x="570" y="240" width="230" height="120" rx="6" class="bx"/>
<text x="582" y="262" class="t">Head editor approves</text>
<text x="582" y="281" class="s">approve · reject · discuss</text>
<text x="582" y="296" class="s">approved edits wait in the</text>
<text x="582" y="311" class="s">database until the apply gate</text>
</g>
<g class="k-hum"><rect x="570" y="410" width="230" height="120" rx="6" class="bx"/>
<text x="582" y="432" class="t">sessions.db</text>
<text x="582" y="451" class="s">segment_edits + acceptances</text>
<text x="582" y="466" class="s">served-version record + origin</text>
<text x="582" y="481" class="s">revision history</text>
</g>
<g class="k-hum"><rect x="570" y="580" width="230" height="120" rx="6" class="bx"/>
<text x="582" y="602" class="t">Segment editor</text>
<text x="582" y="621" class="s">base: human › 1s › pure MT</text>
<text x="582" y="636" class="s">rule + AI edits as suggestions</text>
<text x="582" y="651" class="s">ch01–02 reviewer notes shown</text>
</g>
<g class="k-meas"><rect x="570" y="750" width="230" height="120" rx="6" class="bx"/>
<text x="582" y="772" class="t">B1 · measurement</text>
<text x="582" y="791" class="s">active-time ticks every 5 s</text>
<text x="582" y="806" class="s">pseudonymous editor key</text>
<text x="582" y="821" class="s">distance pure → served → final</text>
</g>
<g class="k-term"><rect x="570" y="920" width="230" height="120" rx="6" class="bx"/>
<text x="582" y="942" class="t">B2 · B3 · term tools</text>
<text x="582" y="961" class="s">Nefnir + ABLTagger lemmas</text>
<text x="582" y="976" class="s">≥ 4 lemma-based change types</text>
<text x="582" y="991" class="s">decision → BÍN forms, book-wide</text>
</g>
