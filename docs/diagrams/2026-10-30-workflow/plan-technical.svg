<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 1110" class="wf" role="img" aria-label="Planned workflow, technical: pure MT (layer 1) and selected MT (layer 1s) feed the editor as base text; a ruling set drives a rule layer and a gated AI term pass into layer 2, shown to editors only as suggestions; an editing gate, an apply gate and a release gate separate preparation, editing, publishing and the open releases; measurement, term tools and audio run alongside.">
<style>
