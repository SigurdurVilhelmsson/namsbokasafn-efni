<text x="302" y="466" class="s">finna, skipta, úrskurður;</text>
<text x="302" y="481" class="s">kóðahlið prófar umfang</text>
</g>
<g class="k-ai"><rect x="290" y="580" width="200" height="120" rx="6" class="bx"/>
<text x="302" y="602" class="t">Lag 2 · 02-mt-revised/</text>
<text x="302" y="621" class="s">skrá yfir hverja breytingu;</text>
<text x="302" y="636" class="s">tætigildi inntaks og líkans</text>
