<defs><marker id="ah-plan-technical-is" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs>
<rect y="0" width="1430" height="1110" class="bg"/>
<text x="140.0" y="36" class="hdr" text-anchor="middle">FRUMTEXTI OG VÉLÞÝÐING</text>
<text x="390.0" y="36" class="hdr" text-anchor="middle">VÉLRÆN LÖG · UNDIRBÚNINGUR</text>
<text x="685.0" y="36" class="hdr" text-anchor="middle">RITSTJÓRN Í RITSTJÓRA</text>
<text x="1005.0" y="36" class="hdr" text-anchor="middle">VISTUN OG BIRTING</text>
<text x="1290.0" y="36" class="hdr" text-anchor="middle">OPNAR ÚTGÁFUR (D)</text>
<rect x="536.0" y="50" width="18" height="1000" class="gate"/>
<text x="549" y="340" class="gater" text-anchor="middle" transform="rotate(-90 549 340)">RITSTJÓRNARHLIÐ · mælingar · samþykki · skrif- og umfangsvarnir · persónuvernd · BÍN getið</text>
<rect x="856.0" y="50" width="18" height="1000" class="gate"/>
<text x="869" y="690" class="gater" text-anchor="middle" transform="rotate(-90 869 690)">VISTUNARHLIÐ · vörn grunntexta · „mannlegt“ eftir bútum í TMX og málheild · persónuvernd · lokaregla · bið aflétt</text>
<rect x="1136.0" y="50" width="18" height="1000" class="gate"/>
<text x="1149" y="790" class="gater" text-anchor="middle" transform="rotate(-90 1149 790)">ÚTGÁFUHLIÐ · réttindi skráð · BÍN haldið utan · leyfis- og þakkarreitir</text>
<g class="k-src"><rect x="30" y="70" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="92" class="t">01-source/</text>
<text x="42" y="111" class="s">CNXML frá OpenStax, læst</text>
<text x="42" y="126" class="s">aldrei endurnýjað frá</text>
<text x="42" y="141" class="s">OpenStax án samþykkis</text>
</g>
<g class="k-src"><rect x="30" y="240" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="262" class="t">02-for-mt/ · 02-structure/</text>
<text x="42" y="281" class="s">enskir bútar dregnir út á ný</text>
<text x="42" y="296" class="s">ein gerð merkja</text>
</g>
<g class="k-mt"><rect x="30" y="410" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="432" class="t">Lag 1 · 02-mt-output/</text>
<text x="42" y="451" class="s">hrein þýðing Málstaðar</text>
<text x="42" y="466" class="s">aldrei skrifað yfir</text>
<text x="42" y="481" class="s">uppruni skráður á einingu</text>
</g>
<g class="k-mt"><rect x="30" y="580" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="602" class="t">Lag 1s · 02-mt-selected/</text>
<text x="42" y="621" class="s">val milli keyrslna fyrir</text>
<text x="42" y="636" class="s">hvern bút + skrá; endurbeiðni</text>
<text x="42" y="651" class="s">fyrir óþýdda búta</text>
</g>
<g class="k-out"><rect x="30" y="750" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="772" class="t">Forskoðun vélþýðingar</text>
<text x="42" y="791" class="s">lag 1s sett inn og</text>
<text x="42" y="806" class="s">teiknað; lesendur sjá það</text>
<text x="42" y="821" class="s">þar til kaflinn er yfirfarinn</text>
</g>
<g class="k-note"><rect x="30" y="920" width="220" height="120" rx="6" class="bx"/>
<text x="42" y="942" class="t">Prófanir án kostnaðar</text>
<text x="42" y="961" class="s">hringferð + birtingarprófun</text>
<text x="42" y="976" class="s">talning merkja, varðmerki</text>
<text x="42" y="991" class="s">áður en forskoðun fer út</text>
</g>
