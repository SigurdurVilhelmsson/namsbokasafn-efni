<text x="302" y="281" class="s">ákveðnar breytingar:</text>
<text x="302" y="296" class="s">flettiorð, merkingar,</text>
<text x="302" y="311" class="s">reiknuð nákvæm skipti</text>
</g>
<g class="k-ai"><rect x="290" y="410" width="200" height="120" rx="6" class="bx"/>
