<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 1110" class="wf" role="img" aria-label="Fyrirhugað vinnuferli, tæknilega: hrein vélþýðing (lag 1) og valin vélþýðing (lag 1s) eru grunntexti ritilsins; íðorðaúrskurðir stýra reglulagi og hliðvarinni gervigreindaryfirferð í lag 2, sem ritstjórar sjá aðeins sem tillögur; ritstjórnarhlið, vistunarhlið og útgáfuhlið skilja að undirbúning, ritstjórn, birtingu og opnar útgáfur; mælingar, íðorðatól og hljóð fylgja með.">
