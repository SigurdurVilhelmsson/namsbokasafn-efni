<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 1280 520" class="wf" role="img" aria-label="Vinnuferlið í dag: frumtexta OpenStax er skipt í búta, hann vélþýddur, yfirfarinn af ritstjórum, samþykktur af aðalritstjóra og smíðaður aftur sem vefsíður; vélþýðingin birtist fyrst sem forskoðun.">
<style>
.bg{fill:#f7f9fb}
text{font-family:'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif;fill:#18222e}
.t{font-size:13px;font-weight:650}.s{font-size:11.5px;fill:#465364}
.m{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:10.5px;fill:#465364}
.lbl{font-size:11px;fill:#465364;paint-order:stroke;stroke:#f7f9fb;stroke-width:4px;stroke-linejoin:round}
.hdr{font-size:11px;font-weight:700;letter-spacing:.08em;fill:#465364}
.lg{font-size:11px;fill:#465364}.ax{font-size:10.5px;fill:#465364}
.gatet{font-size:10.5px;font-weight:700;letter-spacing:.08em;fill:#b53d22}
.gater{font-size:10.5px;font-weight:700;letter-spacing:.06em;fill:#b53d22}
.numt{font-size:11px;font-weight:700;fill:#ffffff}
.tagt{font-size:9.5px;font-weight:700;letter-spacing:.04em;fill:#ffffff}
.bx{stroke-width:1.4}.bx.dash{stroke-dasharray:5 4}
.ar{fill:none;stroke:#5d6b7c;stroke-width:1.5}.ar.dash{stroke-dasharray:5 4}
.ahp{fill:#5d6b7c}.ln{fill:none;stroke:#9aa6b4;stroke-width:1;stroke-dasharray:3 3}
.gate{fill:#f6d9cf;stroke:#c4452a;stroke-width:1.2}
.band{fill:#eef2f6}.bar{rx:3}
.k-src .bx{fill:#eceff3;stroke:#8592a2}.k-src .num,.k-src .tag{fill:#6b7787}
.k-mt .bx{fill:#e1ebfa;stroke:#3a6cb4}.k-mt .num,.k-mt .tag,.k-mt .bar{fill:#3a6cb4}
.k-ai .bx{fill:#ede5fa;stroke:#7549c0}.k-ai .num,.k-ai .tag,.k-ai .bar{fill:#7549c0}
.k-hum .bx{fill:#dff2e7;stroke:#2c8656}.k-hum .num,.k-hum .tag,.k-hum .bar{fill:#2c8656}
.k-out .bx{fill:#fbedd5;stroke:#b0731b}.k-out .num,.k-out .tag,.k-out .bar{fill:#b0731b}
.k-term .bx{fill:#fae3e9;stroke:#b3426a}.k-term .num,.k-term .tag,.k-term .bar{fill:#b3426a}
.k-meas .bx{fill:#ddf0f3;stroke:#24828f;stroke-dasharray:5 3}.k-meas .tag,.k-meas .bar{fill:#24828f}
.k-note .bx{fill:none;stroke:#9aa6b4;stroke-dasharray:4 4}
.k-warn .bx{fill:none;stroke:#c4452a;stroke-dasharray:4 4}
.warnt{font-size:10.5px;fill:#b53d22}
.ar.prev{stroke:#3a6cb4;stroke-dasharray:6 3}
.ms{fill:none;stroke:#c4452a;stroke-width:1.2;stroke-dasharray:4 3}
</style>
<defs><marker id="ah-now-overview-is" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs>
<rect y="80" width="1280" height="520" class="bg"/>
<g class="k-src"><rect x="30" y="210" width="180" height="112" rx="6" class="bx"/>
<circle cx="48" cy="210" r="10" class="num"/>
<text x="48" y="214" class="numt" text-anchor="middle">1</text>
<text x="42" y="240" class="t">Kennslubók OpenStax</text>
<text x="42" y="259" class="s">Enskar frumskrár</text>
<text x="42" y="274" class="s">(CNXML)</text>
</g>
<g class="k-src"><rect x="238" y="210" width="180" height="112" rx="6" class="bx"/>
<circle cx="256" cy="210" r="10" class="num"/>
<text x="256" y="214" class="numt" text-anchor="middle">2</text>
<text x="250" y="240" class="t">Skipt í búta</text>
<text x="250" y="259" class="s">setningar, efnisgreinar,</text>
<text x="250" y="274" class="s">hver með fast auðkenni</text>
</g>
<g class="k-mt"><rect x="446" y="210" width="180" height="112" rx="6" class="bx"/>
<circle cx="464" cy="210" r="10" class="num"/>
<text x="464" y="214" class="numt" text-anchor="middle">3</text>
<text x="458" y="240" class="t">Vélþýðing</text>
<text x="458" y="259" class="s">Málstaður API</text>
<text x="458" y="274" class="s">(Miðeind)</text>
</g>
<g class="k-hum"><rect x="654" y="210" width="180" height="112" rx="6" class="bx"/>
<circle cx="672" cy="210" r="10" class="num"/>
<text x="672" y="214" class="numt" text-anchor="middle">4</text>
<text x="666" y="240" class="t">Ritstjórar yfirfara</text>
<text x="666" y="259" class="s">í Ritstjóra,</text>
<text x="666" y="274" class="s">ritlinum á vefnum</text>
</g>
<g class="k-hum"><rect x="862" y="210" width="180" height="112" rx="6" class="bx"/>
<circle cx="880" cy="210" r="10" class="num"/>
<text x="880" y="214" class="numt" text-anchor="middle">5</text>
<text x="874" y="240" class="t">Aðalritstjóri</text>
<text x="874" y="259" class="s">samþykkir; vistað sem</text>
<text x="874" y="274" class="s">ritstýrð þýðing</text>
</g>
<g class="k-out"><rect x="1070" y="210" width="180" height="112" rx="6" class="bx"/>
<circle cx="1088" cy="210" r="10" class="num"/>
<text x="1088" y="214" class="numt" text-anchor="middle">6</text>
<text x="1082" y="240" class="t">Vefsíður smíðaðar</text>
<text x="1082" y="259" class="s">íslenski textinn settur</text>
<text x="1082" y="274" class="s">aftur inn í uppbyggingu</text>
<text x="1082" y="289" class="s">bókarinnar</text>
</g>
<polyline points="210,266 236,266" class="ar " marker-end="url(#ah-now-overview-is)"/>
<polyline points="418,266 444,266" class="ar " marker-end="url(#ah-now-overview-is)"/>
<polyline points="626,266 652,266" class="ar " marker-end="url(#ah-now-overview-is)"/>
<polyline points="834,266 860,266" class="ar " marker-end="url(#ah-now-overview-is)"/>
<polyline points="1042,266 1068,266" class="ar " marker-end="url(#ah-now-overview-is)"/>
<polyline points="536.0,210 536.0,140 1160.0,140 1160.0,208" class="ar " marker-end="url(#ah-now-overview-is)"/>
<text x="848.0" y="112" class="lbl" text-anchor="middle">Vélþýðingin fer strax á vefinn, merkt „Vélþýðing – ekki yfirfarin“.</text>
<text x="848.0" y="126" class="lbl" text-anchor="middle">Hver eining skiptir yfir í yfirfarna textann þegar yfirferðin er samþykkt.</text>
<g class="k-term"><rect x="446" y="430" width="388" height="96" rx="6" class="bx"/>
<text x="458" y="452" class="t">Íðorðagrunnur og orðalisti</text>
<text x="458" y="471" class="s">samþykkt íslensk íðorð, send með</text>
<text x="458" y="486" class="s">vélþýðingunni og prófuð í ritlinum</text>
</g>
<polyline points="536.0,430 536.0,324" class="ar " marker-end="url(#ah-now-overview-is)"/>
<text x="544.0" y="380" class="lbl" text-anchor="start">íðorð</text>
<polyline points="744.0,430 744.0,324" class="ar " marker-end="url(#ah-now-overview-is)"/>
<text x="752.0" y="380" class="lbl" text-anchor="start">íðorðaprófun</text>
<g class="k-out"><rect x="862" y="430" width="180" height="96" rx="6" class="bx"/>
<text x="874" y="452" class="t">Þýðingaminni</text>
<text x="874" y="471" class="s">setningapör EN–IS</text>
<text x="874" y="486" class="s">(TMX), endursmíðað</text>
<text x="874" y="501" class="s">eftir hverja samþykkt</text>
</g>
<polyline points="952.0,322 952.0,428" class="ar " marker-end="url(#ah-now-overview-is)"/>
<text x="960.0" y="380" class="lbl" text-anchor="start">endursmíðað</text>
<g class="k-out"><rect x="1070" y="430" width="180" height="96" rx="6" class="bx"/>
<text x="1082" y="452" class="t">namsbokasafn.is</text>
<text x="1082" y="471" class="s">lesendavefurinn,</text>
<text x="1082" y="486" class="s">uppfærður með</text>
<text x="1082" y="501" class="s">handvirkri samstillingu</text>
</g>
<polyline points="1160.0,322 1160.0,428" class="ar " marker-end="url(#ah-now-overview-is)"/>
<text x="1168.0" y="380" class="lbl" text-anchor="start">handvirk samstilling</text>
<g class="k-note"><rect x="30" y="430" width="388" height="96" rx="6" class="bx"/>
<text x="42" y="452" class="t">Hver gerir hvað</text>
<text x="42" y="471" class="s">Um fimm ritstjórar og aðalritstjóri vinna</text>
<text x="42" y="486" class="s">í vafranum. Verkefnisstjóri keyrir</text>
<text x="42" y="501" class="s">skipanalínutólin, samstillir og gefur út.</text>
</g>
<g class="k-src"><rect x="30" y="570" width="14" height="14" rx="3" class="bx"/></g>
<text x="50" y="581" class="lg" text-anchor="start">Frumtexti / uppbygging</text>
<g class="k-mt"><rect x="213.94" y="570" width="14" height="14" rx="3" class="bx"/></g>
<text x="233.94" y="581" class="lg" text-anchor="start">Vélþýðing</text>
<g class="k-hum"><rect x="316.37" y="570" width="14" height="14" rx="3" class="bx"/></g>
<text x="336.37" y="581" class="lg" text-anchor="start">Ritstjórn</text>
<g class="k-term"><rect x="418.8" y="570" width="14" height="14" rx="3" class="bx"/></g>
<text x="438.8" y="581" class="lg" text-anchor="start">Íðorð</text>
<g class="k-out"><rect x="496.15" y="570" width="14" height="14" rx="3" class="bx"/></g>
<text x="516.15" y="581" class="lg" text-anchor="start">Útgefið efni</text>
</svg>
