<text x="980" y="821" class="s">run by hand</text>
<text x="980" y="836" class="s">PUBLISHED_BOOKS allowlist</text>
<text x="980" y="851" class="s">then build + deploy.yml</text>
</g>
<g class="k-out"><rect x="692" y="780" width="210" height="130" rx="6" class="bx"/>
