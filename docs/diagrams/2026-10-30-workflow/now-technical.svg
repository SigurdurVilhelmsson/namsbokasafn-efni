<polyline points="1454,590 1518,590" class="ar " marker-end="url(#ah-now-technical-en)"/>
<text x="1487.0" y="582" class="lbl" text-anchor="middle">render</text>
<polyline points="1374,190 1374,538" class="ar " marker-end="url(#ah-now-technical-en)"/>
<text x="1382" y="360" class="lbl" text-anchor="start">swap &lt;image src&gt;</text>
<polyline points="872,60 872,48 1211.0,48 1211.0,520 1284,520 1284,538" class="ar prev" marker-end="url(#ah-now-technical-en)"/>
<text x="1205.0" y="44" class="lbl" text-anchor="end">mt-preview: inject pure MT, skip review</text>
<g class="k-src"><rect x="1520" y="780" width="210" height="130" rx="6" class="bx"/>
<text x="1532" y="802" class="t">git-backup.sh</text>
<text x="1532" y="821" class="s">cron every 2 h: commits</text>
<text x="1532" y="836" class="s">books/ and pushes to</text>
<text x="1532" y="851" class="s">GitHub main</text>
</g>
<g class="k-src"><rect x="1244" y="780" width="210" height="130" rx="6" class="bx"/>
