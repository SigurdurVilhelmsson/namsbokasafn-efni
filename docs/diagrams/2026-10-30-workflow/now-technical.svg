<text x="1256" y="821" class="s">public repository</text>
<text x="1256" y="836" class="s">the sync Action has</text>
<text x="1256" y="851" class="s">never succeeded</text>
</g>
<g class="k-out"><rect x="968" y="780" width="210" height="130" rx="6" class="bx"/>
