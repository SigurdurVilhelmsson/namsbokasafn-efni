    <header>
      <h1 id="title">Jónunarfastar veikra basa</h1>
    </header>
    <main>
<table id="fs-idp355782560" class="top-titled" data-table-number="I1" data-summary="Tafla með þremur dálkum ber heitið „Jónunarfastar veikra basa“. Frá vinstri til hægri eru dálkafyrirsagnirnar „Basi, Lewis-formúla og K með neðanskriftinni b við 25 gráður á Celsíus“. Frá vinstri til hægri inniheldur fyrsta röðin „ammoníak“, mynd af Lewis-formúlu þess og 1,8 sinnum tíu í mínus fimmta veldi. Lewis-formúlan er bókstafurinn N með tveimur punktum hlið við hlið fyrir ofan hann. Lína sem tengist bókstafnum H gengur út frá vinstri, hægri og neðri hluta miðlæga N-sins. Önnur röðin inniheldur „dímetýlamín“, mynd af Lewis-formúlu þess og 5,9 sinnum tíu í mínus fjórða veldi. Lewis-formúlan er bókstafurinn N með tveimur punktum hlið við hlið fyrir neðan hann. Lína tengist upp við bókstafinn H. Línur frá vinstri og hægri hlið miðlæga N-sins tengjast C á báðum hliðum. Hvert C hefur H tengt fyrir ofan, neðan og utan á formúlunni. Þriðja röðin inniheldur „metýlamín“, mynd af Lewis-formúlu þess og 4,4 sinnum tíu í mínus fjórða veldi. Lewis-formúlan er bókstafurinn N með tveimur punktum hlið við hlið fyrir ofan hann. Tvær línur ganga út frá þessu N og tengjast H til hægri og fyrir neðan. Lína gengur út frá vinstri hlið N-sins og tengist bókstafnum C. Þetta C hefur H tengt fyrir ofan, neðan og til vinstri. Fjórða röðin inniheldur „fenýlamín (anilín)“, mynd af Lewis-formúlu þess og 4,3 sinnum tíu í mínus tíunda veldi. Lewis-formúlan er bókstafurinn N með tveimur punktum hlið við hlið fyrir neðan hann. Tvær línur ganga skáhallt út frá neðri hluta N-sins og tengjast H til vinstri og öðru til hægri. Lína gengur upp frá N-inu og tengist C sem er neðsta horn sexhyrnings með bókstafnum C á hverju 6 horna hans. Neðsta C-ið hefur 1 línu sem tengir það við næsta C til vinstri og tvær línur sem tengja það við C-ið til hægri. Hinar 6 hliðar sexhyrningsins endurtaka þetta mynstur, þar sem stakar og tvöfaldar línur skiptast á. Að undanskildu neðsta C-inu hefur hvert annað C línu sem tengir það við H sem teygir sig út frá miðju sexhyrningsins. Fimmta röðin inniheldur „trímetýlamín“, mynd af Lewis-formúlu þess og 6,3 sinnum tíu í mínus fimmta veldi. Lewis-formúlan er miðlægt N með tveimur punktum fyrir neðan það og línum sem ganga út frá efri, vinstri og hægri hlið og tengjast hver um sig sérstökum bókstaf C. Hvert C hefur þrjár línur sem tengjast sérstöku H fyrir hverja línu.">
