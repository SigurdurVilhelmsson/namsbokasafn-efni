name: Documentation Check

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'server/routes/**'
      - 'scripts/**'
  # Manual trigger. Needed to re-verify CI health without inventing a commit —
  # e.g. after the 2026-07 Actions billing outage, when every run failed in ~3s
  # and there was no way to confirm the fix short of pushing something.
  workflow_dispatch:
jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation
        run: npm run docs:generate

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain docs/_generated/)" ]; then
            echo "⚠️ Generated docs are out of date!"
            echo "Run 'npm run docs:generate' and commit the changes"
            git diff docs/_generated/
            exit 1
          fi
          echo "✅ Documentation is up to date"
