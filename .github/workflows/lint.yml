name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Needed to re-verify CI health without inventing a commit —
  # e.g. after the 2026-07 Actions billing outage, when every run failed in ~3s
  # and there was no way to confirm the fix short of pushing something.
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
