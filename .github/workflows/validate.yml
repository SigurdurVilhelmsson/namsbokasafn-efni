name: Validate

on:
  push:
    branches: [main]
    paths:
      - 'books/**/status.json'
      - 'templates/**'
      - 'schemas/**'
      - 'scripts/validate-status.js'
      - 'books/**/05-publication/**'
      - 'tools/cnxml-render*.js'
  pull_request:
    branches: [main]
    paths:
      - 'books/**/status.json'
      - 'templates/**'
      - 'schemas/**'
      - 'scripts/validate-status.js'
      - 'books/**/05-publication/**'
      - 'tools/cnxml-render*.js'

jobs:
  validate-status:
    name: Validate Status Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Validate chapter status files
        run: node scripts/validate-status.js

      # Render-stage structural check (A3). Non-blocking REPORT: it currently
      # exits non-zero on ~30 pre-existing math/image drops (documented fidelity
      # gaps), so it must not fail CI until those are triaged (fixed or
      # explicitly accepted). The detection logic itself is gated by the
      # acceptance vitest in `npm test`. Flip continue-on-error to false once
      # the pre-existing drops are resolved to make this a hard gate.
      - name: Render-stage structural check (report)
        continue-on-error: true
        run: npm run fidelity:render
